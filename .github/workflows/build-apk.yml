
name: Build MedPuzzle APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MedPuzzle_Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-dev \
            build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Extract project
        run: |
          echo "Checking ZIP file..."

          if [ ! -f MedPuzzle_Source.zip ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p app
          unzip -q MedPuzzle_Source.zip -d app

          echo "Searching for buildozer.spec..."

          SPEC_FILE=$(find app -type f -name "buildozer.spec" -print -quit)

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found inside ZIP!"
            find app -maxdepth 4 -type f
            exit 1
          fi

          SPEC_DIR=$(dirname "$SPEC_FILE")

          if [ "$SPEC_DIR" != "app" ]; then
            cp -a "$SPEC_DIR"/. app/
          fi

          echo "Project files:"
          ls -la app

          if [ ! -f app/main.py ]; then
            echo "ERROR: main.py not found in project root!"
            exit 1
          fi

          echo "Project extraction completed successfully."

      - name: Build Android APK
        working-directory: app
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedPuzzle-APK
          path: app/bin/*.apk
          if-no-files-found: error
