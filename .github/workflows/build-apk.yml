name: Build MedPuzzle APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MedPuzzle_Source.zip'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-dev \
            build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Extract project
        run: |
          test -f MedPuzzle_Source.zip
          test -f buildozer.spec
          mkdir app
          unzip -q MedPuzzle_Source.zip -d app
          cp buildozer.spec app/buildozer.spec

      - name: Build Android APK
        working-directory: app
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedPuzzle-APK
          path: app/bin/*.apk
          if-no-files-found: error
